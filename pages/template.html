<!-- pages/template.html -->
<div class="animate-slide-up p-4">
  
  <div class="flex justify-between items-center mb-4">
    <h2 class="text-xl font-bold text-slate-800">Template</h2>
    <button 
      data-admin
      onclick="openModalTambahTemplate()" 
      class="inline-flex items-center gap-2 px-4 py-2 bg-cyan-600 hover:bg-cyan-700 text-white text-sm font-medium rounded-lg transition-colors shadow-sm">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"/>
      </svg>
      Tambah Template
    </button>
  </div>
  
  <div class="bg-white rounded-lg shadow border border-gray-200 overflow-hidden">
    <table class="w-full text-sm text-left">
      <thead class="bg-gray-50 border-b border-gray-200">
        <tr>
          <th class="px-4 py-3 font-semibold text-slate-700">Template</th>
          <th class="px-4 py-3 font-semibold text-slate-700">Keterangan</th>
          <th class="px-4 py-3 font-semibold text-slate-700 text-center">Aksi</th>
        </tr>
      </thead>
      <tbody id="templateTableBody" class="divide-y divide-gray-200">
        <!-- Row 1: Template Mitra -->
        <tr class="hover:bg-gray-50" data-id="1">
          <td class="px-4 py-3 font-medium text-slate-700">Template Data Mitra</td>
          <td class="px-4 py-3 text-slate-600">Format Excel untuk input data mitra baru</td>
          <td class="px-4 py-3 text-center">
            <div class="flex justify-center gap-2">
              <button onclick="downloadTemplateMitra()" class="inline-flex items-center gap-1 px-3 py-1.5 bg-cyan-600 hover:bg-cyan-700 text-white text-xs font-medium rounded transition-colors" title="Download">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
              </button>
              <button onclick="hapusTemplate(1)" class="inline-flex items-center gap-1 px-3 py-1.5 bg-red-600 hover:bg-red-700 text-white text-xs font-medium rounded transition-colors" title="Hapus">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
              </button>
            </div>
          </td>
        </tr>
        
        <!-- Row 2: Template Kegiatan -->
        <tr class="hover:bg-gray-50" data-id="2">
          <td class="px-4 py-3 font-medium text-slate-700">Template Input Kegiatan</td>
          <td class="px-4 py-3 text-slate-600">Format Excel untuk input kegiatan kerjasama</td>
          <td class="px-4 py-3 text-center">
            <div class="flex justify-center gap-2">
              <button onclick="downloadTemplateKegiatan()" class="inline-flex items-center gap-1 px-3 py-1.5 bg-cyan-600 hover:bg-cyan-700 text-white text-xs font-medium rounded transition-colors" title="Download">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
              </button>
              <button onclick="hapusTemplate(2)" class="inline-flex items-center gap-1 px-3 py-1.5 bg-red-600 hover:bg-red-700 text-white text-xs font-medium rounded transition-colors" title="Hapus">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
              </button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  
  
</div>
