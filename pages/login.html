<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>Login Sistem Kerjasama</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body
    class="relative min-h-screen flex items-center justify-center overflow-hidden"
  >
    <!-- Background Image -->
    <div class="absolute inset-0 -z-10">
      <img
        src="../assets/img/Gedung-Terpadu-2024-65-1-scaled.jpg"
        class="w-full h-full object-cover blur-sm scale-110"
      />

      <!-- Overlay gelap -->
      <div class="absolute inset-0 bg-black/40"></div>
    </div>

    <!-- Glow Background -->
    <div
      class="absolute w-96 h-96 bg-purple-400 rounded-full blur-3xl opacity-30 -top-20 -left-20"
    ></div>
    <div
      class="absolute w-96 h-96 bg-pink-400 rounded-full blur-3xl opacity-30 -bottom-20 -right-20"
    ></div>

    <div
      class="relative backdrop-blur-lg bg-white/50 backdrop-blur-xl w-full max-w-md p-8 rounded-2xl shadow-2xl border border-white/20"
    >
      <div class="text-center mb-6">
        <h1 class="text-2xl font-bold text-purple-700">Login</h1>
        <p class="text-sm text-gray-500">Sistem Kerjasama UNIDA</p>
      </div>

      <form id="loginForm" class="space-y-4">
        <div>
          <label class="text-sm font-medium">Username</label>
          <input
            type="text"
            id="username"
            required
            class="w-full mt-1 px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-400"
          />
        </div>

        <div>
          <label class="text-sm font-medium">Password</label>
          <input
            type="password"
            id="password"
            required
            class="w-full mt-1 px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-400"
          />
        </div>

        <!-- Tambahkan id="btnLogin" dan span untuk loading -->
<button
  type="submit"
  id="btnLogin"
  class="w-full bg-purple-700 hover:bg-purple-800 text-white py-2 rounded-lg transition flex items-center justify-center gap-2"
>
  <span id="btnText">Login</span>
  <!-- Spinner (hidden by default) -->
  <svg 
    id="btnSpinner" 
    class="animate-spin h-4 w-4 text-white hidden" 
    xmlns="http://www.w3.org/2000/svg" 
    fill="none" 
    viewBox="0 0 24 24"
  >
    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
  </svg>
</button>
      </form>

      <p id="errorMsg" class="text-red-500 text-sm text-center mt-4 hidden">
        Username atau password salah
      </p>

      <p class="text-center text-sm mt-4">
        Belum punya akun?
        <a
          href="register.html"
          class="text-purple-600 font-semibold hover:underline"
        >
          Daftar
        </a>
      </p>
    </div>

    <script src="../assets/js/auth-guard.js"></script>
    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/login.js"></script>
  </body>
</html>
